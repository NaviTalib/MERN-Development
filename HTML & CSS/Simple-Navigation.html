<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Navigation</title>
    <style>
        *{
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        .navbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: #1e293b;
            color:#ffffff;
        }
        .brand{
            font-size: 1.25rem;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
        }
        .nav-links a{
            margin: 10px;
            color:#cbd5e1;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.2s ease-in-out;
        }
        .nav-links a:hover{
            color:#38bdf8 ;
        }
        .btn{
            background-color:#0284c7 ;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background-color 0.2s ease-in-out;
        }

        .btn:hover{
            background-color:#0369a1 ;
        }

        @media(max-width:640px){
            .navbar{
                flex-direction: column;
                gap:1rem;
                text-align: center;
            }
            .nav-links{
                flex-direction: column;
                gap: 0.75rem;
            }
        }

    </style>
</head>
<body>
    <header class="navbar">
        <a href="" class="brand">My Website</a>

        <nav class="nav-links">
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Services</a>
            <a href="">Contact</a>
        </nav>

        <a href="" class="btn">Get Started</a>
    </header>
</body>
</html>
