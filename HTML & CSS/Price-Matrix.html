<!-- pseudo-classes, -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Matrix</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .pricing-table{
            width: 100%;
            max-width: 480px;
            border-collapse: collapse;
            margin: 40px auto;
            border: 4px solid;
        }
        thead{
            border-bottom: 1px solid;
        }
        .pricing-table tbody tr:nth-child(even){
            background-color: #f8facf;
        }
        .pricing-table td:first-child{
            font-weight: 600;
        }
        .pricing-table tbody tr:hover{
            background-color: #e0f2fe;
            cursor: pointer;
        }
        .pricing-table:hover tbody tr:not(:hover){
            opacity: 0.6;
        }
    </style>
 </head>
 <body>

    <table class="pricing-table">
        <thead>
            <tr>
                <th>Feature</th>
                <th>Basic</th>
                <th>Pro</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Storage</td>
                <td>10 GB</td>
                <td>100 GB</td>
            </tr>
            <tr>
                <td>Users</td>
                <td>1</td>
                <td>5</td>
            </tr>
            <tr>
                <td>Support</td>
                <td>Email</td>
                <td>24/7</td>
            </tr>
            <tr>
                <td>Custom Domain</td>
                <td>No</td>
                <td>Yes</td>
            </tr>
        </tbody>
    </table>


 </body>
 </html>
