<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        .card {
            width: 300px;
            margin: 40px auto;
            padding: 24px;
            border: 4px solid #3b82f6;
            background-color: #f8fafc;
            border-radius: 8px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            margin-bottom: 12px;
            border: 1px solid #1d4ed8;
            background-color: #dbeafe;
        }
    </style>
</head>

<body>

    <div class="card">
        <span class="badge">Featured</span>
        <h2 class="title">Box Model Demo</h2>
        <p class="content">Adjust padding and border without breaking the 300px total container width.</p>
    </div>

</body>

</html>
