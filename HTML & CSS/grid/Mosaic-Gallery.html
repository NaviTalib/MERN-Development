<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosaic Gallery</title>
    <style>
        *{
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        body{
            height: 100vh;
            overflow: hidden;
        }
        .gallery{
            height: calc(100vh - 80vh);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 200px;
            gap: 16px;
            padding: 20px;
        }
        img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }
        .gallery .card-tall{
            grid-row: span 2;
        }
        .gallery .card-wide{
            grid-column: span 2;
        }
        .gallery .card-large{
            grid-column: span 2;
            grid-row: span 2;
        }
        @media (max-width: 600px) {
            .gallery{
                grid-template-columns: 1fr;
            }
            .gallery .card-tall,
            .gallery .card-wide,
            .gallery .card-large{
                grid-column: span 1;
                grid-row: span 1;
            }
            
        }
    </style>
</head>
<body>
    <div class="gallery">
        <div class="card card-tall"><img src="img placeholder.jpeg" alt=""></div>
        <div class="card"><img src="img placeholder.jpeg" alt=""></div>
        <div class="card card-wide"><img src="img placeholder.jpeg" alt=""></div>
        <div class="card"><img src="img placeholder.jpeg" alt=""></div>
        <div class="card card-large"><img src="img placeholder.jpeg" alt=""></div>
        <div class="card"><img src="img placeholder.jpeg" alt=""></div>
        <div class="card"><img src="img placeholder.jpeg" alt=""></div>
    </div>
</body>
</html>
