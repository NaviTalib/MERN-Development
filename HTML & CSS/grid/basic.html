<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Basics</title>
    <style>
        *{
            box-sizing: border-box;
            padding: 0;
            margin:0;
        }
        .box{
            background-color: #38bdf8;
            color: #ffffff;
            padding:20px ;
            text-align: center;
            border-radius: 8px;
        }
        .grid-container{
            display: grid;
             /* creates 3 equal columns unit 1fr */
            /* grid-template-columns: 1fr 1fr 1fr; */ 


            /* Example 2: Responsive Auto-Fitting Grid (No Media Queries) */
            grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
            gap: 20px;
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>
    
</body>
</html>
