<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar + Top Bar</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .dashboard-container{ /* Fixed typo: dasboard -> dashboard */
            display: flex;
            min-height: 100vh;
        }
        .sidebar{
            display: flex;
            flex-direction: column;
            width: 260px;
            background-color:#0f172a ;
            color: #ffffff;
            padding: 1.5rem 1rem;
            flex-shrink: 0;
        }

        .sidebar-brand{
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding-bottom: 2rem;
            font-weight: 700;
            font-size: 1.25rem;
        }
        .logo-icon{
            width: 32px;
            height: 32px;
            background-color:#38bdf8;
            border-radius: 8px;
        }
        .sidebar-menu{
            display: flex;
            flex-direction: column;
            gap:0.5rem;
            flex-grow: 1;
        }
        .nav-item{
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-item:hover,.nav-item.active{
            background-color:#1e293b;
            color: #ffffff;
        }
        .sidebar-footer{
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding-top: 1rem;
            border-top: 1px solid #334155;
        }
        .user-avatar{
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #0284c7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
        .user-info{
            display: flex;
            flex-direction: column;
        }
        .user-name{
            font-size: 0.9rem;
            font-weight: 600;
        }
        .user-role{
            font-size: 0.75rem;
            color:#94a3b8;
        }
        .main-wrapper{
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .topbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }
        .search-box input{
            padding: 0.5rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            width: 280px;
        }
        .topbar-actions{
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .action-btn{
            background-color: transparent; /* Fixed: changed 'none' to 'transparent' */
            border: 1px solid #e2e8f0;
            padding: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
        }
        .primary-btn{
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
        }
        .content-area{
            padding: 2rem;
            flex-grow:1 ;
        }
        .card-grid{
            display: flex;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .card{
            flex: 1;
            background-color: #ffffff;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            min-height: 120px;
        }
        @media (max-width:768px){
            .dashboard-container{ /* Fixed typo in media query too */
                flex-direction: column;
            }
            .sidebar{
                width: 100%;
            }
            .card-grid{
                flex-direction: column;
            }
            .topbar{
                flex-direction: column;
            }
            .topbar-actions{
                margin-top: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="logo-icon"></div>
                <span class="brand-name">DashUI</span>
            </div>

            <nav class="sidebar-menu">
                <a href="#" class="nav-item active">
                    <span class="icon">📊</span>
                    <span class="label">Overview</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="icon">📈</span>
                    <span class="label">Analytics</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="icon">📁</span>
                    <span class="label">Projects</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="icon">⚙️</span>
                    <span class="label">Setting</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-avatar">NT</div>
                <div class="user-info">
                    <span class="user-name">Navi Talib</span>
                    <span class="user-role">Admin</span>
                </div>
            </div>
        </aside>

        <div class="main-wrapper">
            <header class="topbar">
                <!-- Search box and topbar-actions are now siblings -->
                <div class="search-box">
                    <input type="text" placeholder="Search analytics....">
                </div>

                <div class="topbar-actions">
                    <button class="action-btn">🔔</button>
                    <button class="action-btn">💬</button>
                    <button class="primary-btn">+ New Project</button>
                </div>
            </header>

            <main class="content-area">
                <h1>Welcome back, Navi</h1>
                <p>Here is what happening with your projects today.</p>

                <div class="card-grid">
                    <div class="card">Total Revenue <h2>500$</h2></div>
                    <div class="card">Active Users <h2>97</h2></div>
                    <div class="card">Conversation Rate <h2>78</h2></div>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
