<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Card</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        }

        .card {
            background-image: url(kashmir\ img.webp);
            background-size: cover;
            background-position: center;
            /* width: 100%;
            height: 380px;
            max-width: 580px; */
            margin: 40px auto;
            display: flex;
            justify-content:space-around;
            align-items: center;
            flex-direction: column;
            padding: 10px 15px;

        }

        .card:hover {
            background-position: center;
            transform: scale(1.03);
        }

        h1 {

            font-size: 50px;
        }

        h2 {
            font-size: 30px;
        }


        button {
            padding: 10px 15px;
            font-size: 18px;
            font-weight: 600;
            /* margin-bottom: 20px; */
            background-color: #fff;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>KASHMIR</h1>
        <h2>Explore Paradise</h2>
        <button>Book Now</button>
    </div>

</body>

</html>
