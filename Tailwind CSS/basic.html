<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Basics</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="flex h-screen justify-center items-center bg-[#0F141E]">

    <div class="w-full max-w-lg flex flex-col gap-2 p-8 sm:flex-row sm:items-center sm:gap-4 bg-white rounded-xl shadow-lg">
        <img class="mx-auto block h-24 w-24 object-cover rounded-full sm:mx-0 sm:shrink-0" 
             src="https://media.licdn.com/dms/image/v2/D5635AQFsyapoRMr77Q/profile-framedphoto-shrink_800_800/B56aAGCeT_G0AY-/0/1786807707514?e=1787655600&v=beta&t=3dyL4qV7Efz6xudHIncsRNUha_OvGl_GijzQ1oBvths" 
             alt="Navi Talib">
        
        <div class="space-y-2 text-center sm:text-left">
            <div class="space-y-0.5">
                <p class="text-[2rem] font-semibold text-black leading-tight">Navi Talib</p>
                <p class="font-medium text-gray-500 text-[1.25rem]">Full Stack Developer</p>
            </div>
            <button class="px-4 py-1 text-[1rem] font-semibold rounded-full border border-purple-200 text-purple-600 hover:border-transparent hover:bg-purple-600 hover:text-white active:bg-purple-700 transition-colors">

    </div>

</html>
